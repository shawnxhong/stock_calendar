  - {<<: *umich_verified, date: "2026-08-28", note: "终值"}
  - {<<: *umich_verified, date: "2026-09-11", note: "初值"}
  - {<<: *umich_verified, date: "2026-09-25", note: "终值"}
  - {<<: *umich_verified, date: "2026-10-09", note: "初值"}
  - {<<: *umich_verified, date: "2026-10-23", note: "终值"}
  - {<<: *umich_verified, date: "2026-11-06", note: "初值"}
  - {<<: *umich_verified, date: "2026-11-20", note: "终值"}
  - {<<: *umich_verified, date: "2026-12-04", note: "初值"}
  - {<<: *umich_verified, date: "2026-12-18", note: "终值"}
  - &beige_book_verified {key: beige_book, date: "2026-09-02", verified: true, source: "https://www.federalreserve.gov/monetarypolicy/publications/beige-book-default.htm", source_checked_at: "2026-08-14"}
  - {<<: *beige_book_verified, date: "2026-10-14"}
  - {<<: *beige_book_verified, date: "2026-11-25"}
  # 格式：
  # - {key: ism_manufacturing, date: "YYYY-MM-DD"}
  # - {key: umich, date: "YYYY-MM-DD", note: "初值"}

# 其他需要标记的一次性事件（政策会议、听证、立法截止日等）。
manual_events: []
