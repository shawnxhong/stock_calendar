# ─────────────────────────────────────────────────────────────────────────────
# 人工维护的日历事实。
#
# Agent 可在 operator 提供或要求核实时 APPEND 已核实日期，但绝不编造。
# 本文件之外的机械事件（OPEX、三重魔咒、月末/季末、S&P 季度再平衡）由
# scripts/mechanical_calendar.py 用纯日期数学计算，无需维护。
# ─────────────────────────────────────────────────────────────────────────────

# FOMC 会议日程。美联储提前约一年公布，每年核实一次。
# decision: 决议日（两日会议的第二天）。sep: true 表示含经济预测摘要/点阵图。
# presser: 是否有主席新闻发布会；省略时按 true 处理，建议显式填写。
# minutes: 该次会议纪要发布日（通常为会议后三周）。
# ⚠ 下列日期为占位结构示例，实施前必须逐条核对 federalreserve.gov 官方日程。
fomc_meetings:
  - decision: "2026-01-28"
    sep: false
    presser: true
    minutes: "2026-02-18"
    source: "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm#42828"
    source_checked_at: "2026-08-12"
    verified: true
