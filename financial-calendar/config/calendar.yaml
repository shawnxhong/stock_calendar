# NYSE 非常规整日休市。常规节假日由 market_calendar.py 计算；国丧等临时
# 休市需在这里人工追加，并附交易所官方来源。
market_closures: []
  # - {date: "YYYY-MM-DD", label: "临时休市", source: "https://...", verified: true}

# 指数再平衡生效日。再平衡交易在生效日收盘执行，提前 5 个交易日标记。
# ⚠ FTSE Russell 自 2026 年起改为半年度重构。2026 年 4 月的官方更新
#   将第二次生效日定为 12 月第二个周五，取代更早的 11 月暂定安排。
reconstitutions:
  - {date: "2026-06-26", index: "Russell", verified: true,
     source: "https://www.lseg.com/en/ftse-russell/russell-reconstitution",
     source_checked_at: "2026-08-12",
     note: "FTSE Russell 官方页面确认 2026-06-26 美股收盘后生效"}
  - {date: "2026-12-11", index: "Russell", verified: true,
     source: "https://www.lseg.com/en/insights/ftse-russell/russell-reconstitution-2026-is-approaching-heres-what-you-need-to-know",
     source_checked_at: "2026-08-14",
     note: "LSEG 官方更新确认 2026 年第二次重构于 12 月第二个周五收盘后生效"}
  # S&P 季度再平衡生效于三重魔咒周五，由脚本自动生成，此处无需录入。

# 回购静默期强度：标普 500 市值中处于回购静默窗口的比例，
# 作为「相对季末天数」的函数（day 0 = 3/6/9/12 月最后一个自然日）。
#
# ⚠ 这是一条静态季节性近似，不是数据。它的依据是典型公司政策
#   （季末前约两周或财报前约五周进入静默，财报后 1–2 日解除）以及
#   财报集中在报告月第 2–6 周这一经验事实。
#   它只能用于「本月企业回购受限程度」这类日历语气的表述，
#   绝不可作为流量估计使用。
# 分段线性节点：[相对季末天数, 静默市值占比]
buyback_blackout_curve:
  - [-45, 0.15]
  - [-30, 0.25]
  - [-14, 0.55]
  - [0,   0.80]
  - [14,  0.75]
  - [28,  0.45]
  - [45,  0.20]
  - [60,  0.15]

# 私营机构发布日程（FRED 无覆盖）。按季度人工补充。
# key 必须与 config/events.yaml 中的 key 对应。
private_releases:
