# ─────────────────────────────────────────────────────────────────────────────
# 人工维护的日历事实。
#
# Agent 可在 operator 提供或要求核实时 APPEND 已核实日期，但绝不编造。
# 本文件之外的机械事件（OPEX、三重魔咒、月末/季末、S&P 季度再平衡）由
# scripts/mechanical_calendar.py 用纯日期数学计算，无需维护。
# ─────────────────────────────────────────────────────────────────────────────

# FOMC 会议日程。美联储提前约一年公布，每年核实一次。
# decision: 决议日（两日会议的第二天）。sep: true 表示含经济预测摘要/点阵图。
# presser: 是否有主席新闻发布会；省略时按 true 处理，建议显式填写。
# minutes: 该次会议纪要发布日（通常为会议后三周）。
# ⚠ 下列日期为占位结构示例，实施前必须逐条核对 federalreserve.gov 官方日程。
fomc_meetings: []
  # 格式：
  # - {decision: "YYYY-MM-DD", sep: true, presser: true,
  #    minutes: "YYYY-MM-DD", note: "", source: "https://...", verified: true}

# NYSE 非常规整日休市。常规节假日由 market_calendar.py 计算；国丧等临时
# 休市需在这里人工追加，并附交易所官方来源。
market_closures: []
  # - {date: "YYYY-MM-DD", label: "临时休市", source: "https://...", verified: true}

# 指数再平衡生效日。再平衡交易在生效日收盘执行，提前 5 个交易日标记。
# ⚠ FTSE Russell 自 2026 年起改为半年度重构（6 月 + 11 月）。
#   11 月日期在官方公布前为占位符，必须核实后才可信任。
reconstitutions:
  - {date: "2026-06-26", index: "Russell", verified: false,
     note: "年度重构生效（收盘）—— 待核实"}
  - {date: "2026-11-20", index: "Russell", verified: false,
     note: "占位符 —— 半年度重构，官方公布后必须核实"}
  # S&P 季度再平衡生效于三重魔咒周五，由脚本自动生成，此处无需录入。

# 回购静默期强度：标普 500 市值中处于回购静默窗口的比例，
# 作为「相对季末天数」的函数（day 0 = 3/6/9/12 月最后一个自然日）。
#
# ⚠ 这是一条静态季节性近似，不是数据。它的依据是典型公司政策
#   （季末前约两周或财报前约五周进入静默，财报后 1–2 日解除）以及
#   财报集中在报告月第 2–6 周这一经验事实。
#   它只能用于「本月企业回购受限程度」这类日历语气的表述，
#   绝不可作为流量估计使用。
# 分段线性节点：[相对季末天数, 静默市值占比]
buyback_blackout_curve:
  - [-45, 0.15]
  - [-30, 0.25]
  - [-14, 0.55]
  - [0,   0.80]
  - [14,  0.75]
  - [28,  0.45]
  - [45,  0.20]
  - [60,  0.15]

# 私营机构发布日程（FRED 无覆盖）。按季度人工补充。
# key 必须与 config/events.yaml 中的 key 对应。
private_releases: []
  # 格式：
  # - {key: ism_manufacturing, date: "YYYY-MM-DD"}
  # - {key: umich, date: "YYYY-MM-DD", note: "初值"}

# 其他需要标记的一次性事件（政策会议、听证、立法截止日等）。
manual_events: []
  # 格式：
  # - {date: "YYYY-MM-DD", label: "Jackson Hole 主席讲话", tier: A, time_et: "10:00"}
