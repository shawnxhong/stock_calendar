# 事件解释词典 —— 人工维护，渲染器只读不写。
#
# 这些文字只解释指标定义和常见传导渠道，不预测公布值、市场方向或资金流。
# key 对应 events.yaml 的 source_key，机械事件对应 mech:<key>:<date> 的 key。

events:
  cpi:
    short: "居民消费价格变化，是通胀与货币政策预期的核心输入"
    what: "衡量居民购买的一篮子商品和服务价格随时间的变化，常同时关注总体与核心 CPI。"
    why: "用于判断通胀是否持续、实际购买力如何变化，以及美联储政策约束是否增强或缓和。"
    scope: "通胀预期、美债利率、美元、股票估值及消费相关行业。"

  nfp:
    short: "美国就业、失业率与工资的综合月报，反映劳动力市场强弱"
    what: "汇总非农就业人数、失业率、劳动参与率和平均时薪等劳动力市场数据。"
    why: "就业和工资同时影响居民消费、服务通胀与美联储对充分就业目标的判断。"
    scope: "增长与通胀预期、美债利率、美元及大类资产。"

  pce:
    short: "居民收入、支出与核心 PCE；后者是美联储重点通胀指标"
    what: "报告居民收入和消费支出，并给出 PCE 价格指数；核心 PCE 剔除食品和能源。"
    why: "核心 PCE 是美联储重点参考的通胀指标，收入与支出则显示消费是否可持续。"
    scope: "货币政策预期、利率、美元、消费与成长型股票估值。"

  fomc_decision:
    short: "美联储公布政策利率和政策立场，可能重定价整个利率路径"
    what: "联邦公开市场委员会公布政策利率决定及声明；部分会议同时发布经济预测和点阵图。"
    why: "它直接设定短端政策利率，并传递未来利率路径、通胀和就业风险的官方判断。"
    scope: "全期限美债、美元、股票估值、信用、黄金及全球风险资产。"

  fomc_presser:
    short: "主席解释决议与风险判断，细节可能改变市场对声明的理解"
    what: "美联储主席在决议后解释政策决定、经济判断，并回答媒体问题。"
    why: "问答可澄清声明中的模糊处，补充委员会对未来政策路径和风险平衡的看法。"
    scope: "利率路径预期、美元、股票、信用及市场波动。"

  fomc_minutes:
    short: "披露上次会议讨论细节，观察委员分歧与政策反应函数"
    what: "记录上次 FOMC 会议的政策讨论、风险评估和委员观点，但不是逐字稿。"
    why: "帮助判断投票结果背后的分歧、政策条件和委员会更关注哪些风险。"
    scope: "利率路径、国债期限结构、美元和利率敏感资产。"

  treasury:
    short: "检验市场承接美国长债供给的需求与定价"
    what: "美国财政部发行 10 年或 30 年等长期国债，并公布中标收益率、投标倍数和买家结构。"
    why: "拍卖结果显示新增久期供给能否被顺利吸收，以及投资者对当前收益率的需求。"
    scope: "长端美债收益率、期限溢价、利率敏感股票、美元和信用市场。"

  ppi:
    short: "企业销售端价格变化，是成本压力和商品通胀的上游信号"
    what: "衡量国内生产者销售商品与服务时收到的价格变化，常看总体和核心口径。"
    why: "可观察企业成本与定价压力，并为部分 PCE 分项和利润率变化提供线索。"
    scope: "通胀预期、利率、企业利润率及原材料和工业板块。"

  retail_sales:
    short: "追踪居民商品消费，是判断消费和季度增长动能的重要月度数据"
    what: "衡量零售与餐饮企业的名义销售额；控制组常用于估算 GDP 中的消费。"
    why: "消费是美国经济的主要组成部分，该数据能较早显示家庭支出动能。"
    scope: "增长预期、消费行业、利率、美元及周期股。"

  jolts:
    short: "观察职位空缺、招聘和离职，衡量劳动力供需是否失衡"
    what: "统计职位空缺、招聘、主动离职和裁员等劳动力流动指标。"
    why: "职位与求职者之间的缺口可反映工资压力和就业市场降温或紧张程度。"
    scope: "就业与工资预期、服务通胀、利率和人力密集行业。"

  jobless_claims:
    short: "每周失业救济申请，是最及时的就业市场转折信号之一"
    what: "初请统计首次申请失业救济人数，续请反映仍在领取救济的人数。"
    why: "发布频率高，能比月度就业报告更早提示裁员和再就业状况变化。"
    scope: "短期增长与就业预期、利率、美元和周期资产。"

  gdp:
    short: "经济总产出的综合衡量，分项揭示消费、投资和库存贡献"
    what: "衡量美国境内最终商品和服务的总产出，并分解消费、投资、政府和净出口。"
    why: "用于确认经济扩张或收缩的总体速度，但初值会在后续版本中修订。"
    scope: "增长预期、利率、美元、企业盈利和广泛风险资产。"

  durable_goods:
    short: "追踪耐用品订单，观察制造业需求与企业资本开支意愿"
    what: "统计预期使用三年以上商品的新订单、出货和库存，运输项目会造成较大波动。"
    why: "剔除国防和飞机后的核心资本品订单可提供企业设备投资的前瞻线索。"
    scope: "制造业、资本开支、工业与运输板块及增长预期。"

  industrial_production:
    short: "工厂、矿业和公用事业实际产量，观察经济供给端动能"
    what: "衡量制造业、矿业和公用事业的实际产出，并同时公布产能利用率。"
    why: "可判断商品生产端是否扩张、闲置产能多少，以及制造业周期和供给压力如何变化。"
    scope: "增长预期、美债利率、美元，以及工业、材料、能源和公用事业板块。"

  beige_book:
    short: "美联储辖区的企业访谈汇总，为下一次议息会议提供定性信息"
    what: "汇总 12 个联储辖区对经济活动、就业、工资和价格的企业与社区访谈。"
    why: "提供统计数据尚未覆盖的实时定性变化，是 FOMC 会前判断地区分化和风险的材料。"
    scope: "货币政策预期、地区经济、就业、消费和信贷判断。"

  ism_manufacturing:
    short: "制造业调查扩散指数，较早反映订单、生产、就业和价格变化"
    what: "根据制造业采购经理调查编制；50 通常是活动扩张与收缩的分界。"
    why: "发布时间早，新订单与支付价格等分项可提供增长和商品通胀的领先线索。"
    scope: "制造业周期、工业与材料板块、增长和利率预期。"

  ism_services:
    short: "服务业调查扩散指数，覆盖美国经济中占比更大的服务活动"
    what: "根据服务业采购经理调查编制，包含商业活动、新订单、就业和价格分项。"
    why: "服务业在美国经济和就业中占比较高，价格分项也有助于观察服务通胀。"
    scope: "增长、服务通胀、利率及消费和服务行业。"

  umich:
    short: "居民信心与通胀预期调查，观察消费意愿和预期是否失锚"
    what: "调查居民对个人财务、经济前景和未来通胀的看法，通常有初值和终值。"
    why: "信心影响消费意愿，长期通胀预期也是美联储观察预期锚定的重要信号。"
    scope: "消费预期、通胀预期、利率、美元和消费类股票。"

  adp:
    short: "私营部门工资单估计，提供就业趋势参考但不等同于非农"
    what: "基于 ADP 工资单数据估算美国私营部门就业变化，并提供企业规模和行业分项。"
    why: "可补充观察私营就业趋势，但方法和覆盖范围不同，不能当作非农就业的直接预测。"
    scope: "就业与增长预期、利率，以及人力密集行业。"

  trade_balance:
    short: "商品与服务进出口差额，影响净出口和 GDP 核算"
    what: "统计美国商品和服务出口减进口的差额，并给出主要类别和贸易伙伴分项。"
    why: "净出口直接进入 GDP，也能反映内外需、美元汇率和全球贸易状况。"
    scope: "GDP 核算、美元、贸易敏感行业和跨国企业。"

  consumer_credit:
    short: "居民非房贷借款变化，观察信贷使用和消费融资条件"
    what: "统计循环信贷与非循环信贷余额，主要覆盖信用卡、汽车和教育贷款。"
    why: "显示家庭是否更多依赖借款消费，以及利率变化如何传导到居民融资。"
    scope: "消费、银行与消费金融行业，以及居民资产负债表判断。"

  housing_starts:
    short: "新住宅开工与许可，反映住房供给和建筑活动的前瞻变化"
    what: "统计新住宅开工、建筑许可和完工；许可通常比实际开工更具前瞻性。"
    why: "住房对按揭利率敏感，并带动建材、施工、家居和相关消费。"
    scope: "住房与建筑产业链、利率敏感需求和区域经济。"

  existing_home_sales:
    short: "成屋成交量，观察按揭利率、库存和可负担性的综合影响"
    what: "统计已建成住宅的成交年化速度，并公布库存、价格和销售周期。"
    why: "反映住房需求和市场流动性，也会影响经纪、装修和耐用品消费。"
    scope: "住房产业链、按揭利率、银行和居民消费。"

  empire_state:
    short: "纽约州制造业月度调查，是区域制造活动的早期信号"
    what: "调查纽约州制造企业的经营状况，包含新订单、就业、交付和价格分项。"
    why: "在月内较早发布，可作为制造业变化的辅助信号，但地区覆盖有限且波动较大。"
    scope: "区域制造业、工业板块和全国制造业数据的辅助判断。"

  philly_fed:
    short: "费城联储辖区制造业调查，提供订单、就业和价格的区域信号"
    what: "调查第三联储辖区制造企业，给出当前活动及未来预期等扩散指数。"
    why: "可交叉验证制造业动能和价格压力，但地区样本有限、单月波动较大。"
    scope: "区域制造业、工业板块和全国制造业数据的辅助判断。"

  earnings:
    short: "公司披露经营结果与展望，重点看预期差和管理层指引"
    what: "上市公司公布收入、利润、现金流、业务分项和管理层对未来经营的指引。"
    why: "实际结果与市场预期的差异，以及指引变化，会更新公司和产业链的盈利假设。"
    scope: "公司个股、同行、供应链及相关行业；跨市场影响取决于公司权重。"

  opex:
    short: "月度期权合约到期，持仓展期与对冲调整可能提高盘中波动"
    what: "标准月度股票和指数期权在到期日结算或失效。"
    why: "持仓平仓、行权、展期与做市商对冲调整可能改变成交和短期波动结构。"
    scope: "指数、个股期权及临近执行价的短期交易；不预示固定方向。"

  witching:
    short: "季度多类衍生品集中到期，展期和结算活动通常更密集"
    what: "股指期货、股指期权和个股期权等合约在季度到期日集中结算。"
    why: "大批合约同步展期、平仓和对冲，可能放大成交量及收盘附近波动。"
    scope: "指数、期货、期权和大型成分股；不预示固定方向。"

  sp_rebalance:
    short: "标普指数权重调整收盘生效，被动资金按新权重完成匹配"
    what: "标普指数的成分或权重调整在指定收盘后生效。"
    why: "跟踪指数的被动产品通常需在生效时匹配新权重，相关股票成交可能集中。"
    scope: "新增、剔除和权重变化的成分股，以及收盘竞价；不估算资金规模。"

  month_end:
    short: "月末估值与组合再平衡时点，机构可能进行常规头寸调整"
    what: "当月最后一个交易日，是许多基金估值、基准核对和会计结算时点。"
    why: "常规再平衡和结算可能使收盘成交结构不同于普通交易日。"
    scope: "股票、债券、外汇及收盘交易；不代表必然方向或规模。"

  quarter_end:
    short: "季末估值、报告和再平衡集中，通常比普通月末涉及更多账户"
    what: "季度最后一个交易日，是季报估值、基准核对和部分监管报告的截止点。"
    why: "更多组合同时进行结算与再平衡，可能使成交和资产间调整更集中。"
    scope: "股票、债券、外汇及收盘交易；不代表必然方向或规模。"

  recon:
    short: "指数成分重构生效，被动产品需按新名单和权重调整"
    what: "指数提供商按规则更新成分股、自由流通量或权重，并在指定日期生效。"
    why: "跟踪该指数的基金需要匹配变化，可能令受影响证券在生效日前后成交集中。"
    scope: "被纳入、剔除或权重变化的证券及相关指数产品；不估算资金规模。"

  policy:
    short: "人工核实的政策事件；具体含义以事件名称和官方来源为准"
    what: "由 calendar.yaml 人工维护并附来源的政策或监管日程。"
    why: "政策文本、实施时点或官方沟通可能改变相关行业的规则与预期。"
    scope: "取决于具体事件；应结合原始官方文件判断，不从日历标题推断方向。"
